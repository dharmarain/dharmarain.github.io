site_name: Buddhist Resources
site_url: https://dharmarain.github.io/
site_description: Project to gather together resources and information for Buddhists in one single place.
repo_url: https://github.com/squidfunk/mkdocs-material
repo_name: dharmarain.github.io
theme:
  name: material
  palette:
    # Palette toggle for automatic
    - media: "(prefers-color-scheme)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/git-alt
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
  plugins: 
    - search
    - optimize
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dharma-rain/dharmarain.github.io/
  generator: false
copyright:  | 
  &copy; 2026 Dharma Rain


nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Resources:
    - Theravada: theravada-res.md
    - Mahayana: mahayana-res.md
    - Languages: language-res.md
    - Miscellaenous: misc-res.md

  - Discord: discord.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption